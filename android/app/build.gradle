plugins {
    id 'com.android.application'
}

// Web 壳加载的线上地址。三种覆盖方式（优先级从高到低）：
//   1. 命令行 -PwebUrl=https://xxx
//   2. 环境变量 WEB_URL
//   3. 下面的默认值（部署后替换成你自己的域名）
def webUrl = (project.findProperty('webUrl') ?: System.getenv('WEB_URL') ?: 'https://nongzi.pages.dev').toString()

// 可选的正式签名：把 android/keystore.properties 配好即可自动启用
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.nongzi.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nongzi.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'WEB_URL', "\"${webUrl.replace('"', '\\"')}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 没有配置正式签名时退回 debug 签名，保证 CI 依旧能产出可直接安装的 APK
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
