name: Deploy H5 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build site
        working-directory: web
        env:
          # GitHub Pages 项目站点在子路径下，需要带上仓库名
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # 让备用站也能直接下载 APK：构建失败不阻塞站点发布
      - name: Build release APK
        id: apk
        continue-on-error: true
        working-directory: android
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Put APK into site
        if: steps.apk.outcome == 'success'
        run: |
          mkdir -p web/dist
          cp android/app/build/outputs/apk/release/*.apk web/dist/app-release.apk
          ls -lh web/dist/app-release.apk

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
